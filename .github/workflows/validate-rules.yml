name: Validate rules
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check routing semantics and client formats
        run: python3 scripts/check_rules.py
      - name: Check Python syntax
        run: python3 -m compileall -q scripts
